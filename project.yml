name: Zivlet
options:
  bundleIdPrefix: app.zivlet
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ZivletKit:
    path: Packages/ZivletKit
targets:
  Zivlet:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ZivletKit
        product: ZivletKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Zivlet
        CFBundleDisplayName: Zivlet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Zivlet contributors. GPL-3.0-or-later."
    entitlements:
      path: Config/Zivlet.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zivlet.Zivlet
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # The embed phase reads Vendor/out/media-stage, which the script sandbox would hide.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # P1-50, D-M4-10: copy and sign the vendored helpers before Xcode signs the app. Runs on every build (about
    # a second) so a rebuilt stage is never missed; without a stage, Debug warns and Release fails.
    postBuildScripts:
      - name: Embed media helpers
        script: '"$SRCROOT/Scripts/embed-helpers.sh"'
        basedOnDependencyAnalysis: false
  # Owner-run (D-M4-14): needs an Accessibility/automation grant; not part of make test.
  ZivletUITestsApp:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Zivlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zivlet.ZivletUITestsApp
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Zivlet
        SWIFT_VERSION: "6.0"
schemes:
  Zivlet:
    build:
      targets:
        Zivlet: all
    test:
      targets:
        - ZivletUITestsApp
