name: Zivlet
options:
  bundleIdPrefix: app.zivlet
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ZivletKit:
    path: Packages/ZivletKit
  # P1-53, D-M4-11: Sparkle 2 (MIT). Its SwiftPM binary target is checksum-verified by SwiftPM.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Zivlet:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ZivletKit
        product: ZivletKit
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Zivlet
        CFBundleDisplayName: Zivlet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Zivlet contributors. GPL-3.0-or-later."
        # Sparkle (D-M4-11): the updater starts only when both values are real (UpdaterConfiguration); checks and
        # downloads follow Settings › Updates, so the plist defaults are off and Sparkle never asks on its own.
        SUFeedURL: $(ZIVLET_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: Config/Zivlet.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zivlet.Zivlet
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # The embed phase reads Vendor/out/media-stage, which the script sandbox would hide.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # P1-50, D-M4-10: copy and sign the vendored helpers before Xcode signs the app. Runs on every build (about
    # a second) so a rebuilt stage is never missed; without a stage, Debug warns and Release fails.
    postBuildScripts:
      - name: Embed media helpers
        script: '"$SRCROOT/Scripts/embed-helpers.sh"'
        basedOnDependencyAnalysis: false
  # Owner-run (D-M4-14): needs an Accessibility/automation grant; not part of make test.
  ZivletUITestsApp:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Zivlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zivlet.ZivletUITestsApp
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Zivlet
        SWIFT_VERSION: "6.0"
schemes:
  Zivlet:
    build:
      targets:
        Zivlet: all
    test:
      targets:
        - ZivletUITestsApp
