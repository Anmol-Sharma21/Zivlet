# Release (P1-53). A v* tag, or a manual run, builds the release on the project's release runner (owner step O-4):
# Release archive, inside-out signing, signature gate, notarization, DMG, size gate, corresponding source, SBOM,
# dSYMs, signed appcast, a clean-VM smoke test, and a draft GitHub release. Manual runs are dry runs by default. A dry
# run, or any missing owner input (O-1 Developer ID and notary key, O-2 Sparkle key, O-3 download location), signs
# ad-hoc, skips notarization and the appcast with the owner-step messages, and keeps the files as workflow artifacts
# only. Secrets live in the protected `release` environment and are passed only to the steps that use them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: ad-hoc signature, no notarization, no appcast, no release"
        type: boolean
        default: true
      version:
        description: "Version for a manual run (a tag supplies its own)"
        type: string
        default: "0.0.0-dryrun"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  release:
    name: Build, sign, notarize and draft the release
    runs-on: [self-hosted, macOS, ARM64, zivlet-release]
    environment: release
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the build number is the commit count

      - name: Release mode (signed, or dry run with the owner-step messages)
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
          INPUT_VERSION: ${{ inputs.version }}
          DEVELOPER_ID: ${{ vars.ZIVLET_DEVELOPER_ID }}
          DOWNLOAD_PREFIX: ${{ vars.ZIVLET_DOWNLOAD_URL_PREFIX }}
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' || vars.ZIVLET_NOTARY_PROFILE != '' }}
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          if [[ "$EVENT" == "push" ]]; then version=${REF_NAME#v}; else version=$INPUT_VERSION; fi
          mode=signed
          if [[ "$EVENT" != "push" && "$DRY_INPUT" != "false" ]]; then mode=dry; echo "Dry run requested."; fi
          if [[ -z "$DEVELOPER_ID" || "$HAS_NOTARY" != "true" ]]; then
            mode=dry; echo "Notarization needs the owner's Developer ID and notary key (owner step O-1)."
          fi
          if [[ "$HAS_SPARKLE_KEY" != "true" ]]; then
            mode=dry; echo "Signing the appcast needs the owner's Sparkle key (owner step O-2)."
          fi
          if [[ -z "$DOWNLOAD_PREFIX" ]]; then
            mode=dry; echo "The appcast needs the owner's download location (owner step O-3)."
          fi
          identity="-"
          if [[ "$mode" == "signed" ]]; then identity=$DEVELOPER_ID; fi
          printf 'ZIVLET_VERSION=%s\nZIVLET_MODE=%s\nZIVLET_IDENTITY=%s\n' "$version" "$mode" "$identity" \
            >>"$GITHUB_ENV"
          echo "Release $version: $mode"

      - name: Vendor outputs (runner cache, else build)
        run: Scripts/ci-vendor.sh
      - name: Licence gate
        run: make licence-gate
      - name: Release archive and dSYMs
        run: Scripts/release-build.sh "$ZIVLET_VERSION"
      - name: Sign inside-out
        run: Scripts/sign-app.sh "$ZIVLET_IDENTITY" build/release/work/Zivlet.app
      - name: Signature gate
        run: |
          if [[ "$ZIVLET_MODE" == "signed" ]]; then
            Scripts/verify-signatures.sh build/release/work/Zivlet.app --require-developer-id
          else
            Scripts/verify-signatures.sh build/release/work/Zivlet.app
          fi

      - name: Notarize and staple the app
        if: env.ZIVLET_MODE == 'signed'
        env:
          ZIVLET_NOTARY_PROFILE: ${{ vars.ZIVLET_NOTARY_PROFILE }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          ditto -c -k --keepParent build/release/work/Zivlet.app build/release/work/Zivlet.zip
          Scripts/notarize.sh build/release/work/Zivlet.zip build/release/work/Zivlet.app
      - name: DMG
        run: |
          if [[ "$ZIVLET_MODE" == "signed" ]]; then
            Scripts/make-dmg.sh build/release/work/Zivlet.app "$ZIVLET_VERSION" --identity "$ZIVLET_IDENTITY"
          else
            Scripts/make-dmg.sh build/release/work/Zivlet.app "$ZIVLET_VERSION"
          fi
      - name: Notarize and staple the DMG
        if: env.ZIVLET_MODE == 'signed'
        env:
          ZIVLET_NOTARY_PROFILE: ${{ vars.ZIVLET_NOTARY_PROFILE }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: Scripts/notarize.sh "build/release/Zivlet-$ZIVLET_VERSION.dmg"
      - name: Notarization skipped (dry run)
        if: env.ZIVLET_MODE != 'signed'
        run: |
          echo "skipped: Notarization needs the owner's Developer ID and notary key (owner step O-1)."

      - name: Size gate
        run: Scripts/size-gate.sh build/release/work/Zivlet.app "build/release/Zivlet-$ZIVLET_VERSION.dmg"
      - name: Corresponding source
        run: Scripts/source-bundle.sh "$ZIVLET_VERSION"
      - name: SBOM
        run: Scripts/sbom.sh "$ZIVLET_VERSION"

      - name: Signed appcast (kept with the earlier DMGs on the runner, for deltas)
        if: env.ZIVLET_MODE == 'signed'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ZIVLET_DOWNLOAD_URL_PREFIX: ${{ vars.ZIVLET_DOWNLOAD_URL_PREFIX }}
        run: |
          feed="${RUNNER_TOOL_CACHE:?}/zivlet-releases"
          mkdir -p "$feed"
          cp "build/release/Zivlet-$ZIVLET_VERSION.dmg" "$feed/"
          Scripts/make-appcast.sh "$feed"
          cp "$feed/appcast.xml" build/release/
          find "$feed" -maxdepth 1 -name '*.delta' -exec cp {} build/release/ \;
      - name: Appcast skipped (dry run)
        if: env.ZIVLET_MODE != 'signed'
        run: |
          echo "skipped: Signing the appcast needs the owner's Sparkle key (owner step O-2)."

      - name: Clean-VM smoke test on macOS 26.0
        env:
          ZIVLET_TART_IMAGE: ${{ vars.ZIVLET_TART_IMAGE }}
        run: |
          dmg="build/release/Zivlet-$ZIVLET_VERSION.dmg"
          if [[ "$ZIVLET_MODE" == "signed" ]]; then
            Scripts/vm-smoke.sh "$dmg"
          else
            Scripts/vm-smoke.sh "$dmg" --adhoc || [[ $? -eq 3 ]]
          fi

      - name: Draft GitHub release
        if: env.ZIVLET_MODE == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$ZIVLET_VERSION.md"
          [[ -f "$notes" ]] || { echo "error: $notes is missing" >&2; exit 1; }
          shopt -s nullglob
          gh release create "v$ZIVLET_VERSION" --draft --verify-tag --title "Zivlet $ZIVLET_VERSION" \
            --notes-file "$notes" "build/release/Zivlet-$ZIVLET_VERSION.dmg" \
            "build/release/zivlet-$ZIVLET_VERSION-source.tar.xz" "build/release/zivlet-$ZIVLET_VERSION.spdx.json" \
            "build/release/Zivlet-$ZIVLET_VERSION-dSYMs.zip" build/release/appcast.xml build/release/*.delta

      - name: Keep the release files as workflow artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/release/
            !build/release/work/
          if-no-files-found: warn
          retention-days: 30
